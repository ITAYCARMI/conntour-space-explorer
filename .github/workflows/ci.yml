name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-unit:
    name: Backend unit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --group dev
      - name: Ruff
        run: uv run ruff check .
      - name: Unit tests (no live API)
        run: >
          uv run pytest -q
          tests/test_tag_extractor.py
          tests/test_search_score.py
          tests/test_ingest_idempotency.py

  frontend-unit:
    name: Frontend unit + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: CI=true npm test -- --watchAll=false --testPathPattern=searchState
      - name: Production build
        run: CI=false npm run build

  integration:
    name: Integration (API + Playwright)
    runs-on: ubuntu-latest
    needs: [backend-unit, frontend-unit]
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: docker compose -f docker-compose.dev.yml up -d --build
      - name: Wait for API
        run: |
          for i in $(seq 1 90); do
            if curl -sf "http://127.0.0.1:5001/api/sources?page=1&page_size=1" >/dev/null; then
              echo "API ready"
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.dev.yml ps
          docker compose -f docker-compose.dev.yml logs --tail=120
          exit 1
      - name: Seed database
        run: docker compose -f docker-compose.dev.yml exec -T backend uv run python scripts/seed_db.py
      - name: Backend API tests
        # Run inside the backend container so we don't fight the bind-mounted .venv.
        run: |
          docker compose -f docker-compose.dev.yml exec -T backend \
            sh -c "uv sync --group dev && API_BASE_URL=http://127.0.0.1:5001 uv run pytest -q tests/test_api_endpoints.py"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Playwright e2e
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3001
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Stop stack
        if: always()
        run: docker compose -f docker-compose.dev.yml down -v
